name: FreeCloud Distributed Worker Runner

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "FreeCloud Job ID to process"
        required: true
        type: string
      worker_count:
        description: "Number of parallel workers to deploy (1 to 10)"
        required: true
        default: "4"
        type: string
      backend_url:
        description: "Base URL of FreeCloud AI Studio API (e.g., https://api.freecloud.ai or tunnel URL)"
        required: true
        type: string
      duration_mins:
        description: "Target video duration in minutes"
        required: false
        default: "1.0"
        type: string
      model_name:
        description: "AI Video Generation Model (wan_2_1, minimax_h3, hunyuan_video, auto_relay)"
        required: false
        default: "wan_2_1"
        type: string

permissions:
  contents: read

jobs:
  worker_matrix:
    name: "Worker Runner ${{ matrix.worker_index }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        worker_index: [1, 2, 3, 4]

    steps:
      - name: Checkout FreeCloud Repository
        uses: actions/checkout@v4

      - name: Set up Python with Cached Worker Deps
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-worker.txt"

      - name: Install Fast Worker Dependencies
        run: |
          pip install --disable-pip-version-check -q -r requirements-worker.txt

      - name: Execute Turbo Worker Runner Entrypoint
        env:
          FREECLOUD_BACKEND_URL: ${{ inputs.backend_url }}
          FREECLOUD_JOB_ID: ${{ inputs.job_id }}
          WORKER_ID: "gha-runner-${{ inputs.job_id }}-${{ matrix.worker_index }}"
        run: |
          python github/worker_entrypoint.py \
            --backend-url "$FREECLOUD_BACKEND_URL" \
            --job-id "$FREECLOUD_JOB_ID" \
            --worker-id "$WORKER_ID" \
            --model "${{ inputs.model_name }}" \
            --max-idle-seconds 60
