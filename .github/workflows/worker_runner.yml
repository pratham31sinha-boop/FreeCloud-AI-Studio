name: FreeCloud Distributed Worker Runner

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "FreeCloud Job ID to process"
        required: true
        type: string
      worker_count:
        description: "Number of parallel workers to deploy (1 to 10)"
        required: true
        default: "4"
        type: string
      backend_url:
        description: "Base URL of FreeCloud AI Studio API (e.g., https://api.freecloud.ai or tunnel URL)"
        required: true
        type: string
      duration_mins:
        description: "Target video duration in minutes"
        required: false
        default: "1.0"
        type: string
      model_name:
        description: "AI Video Generation Model (e.g. minimax_h3, animatediff)"
        required: false
        default: "minimax_h3"
        type: string

permissions:
  contents: read

jobs:
  worker_matrix:
    name: "Worker Runner ${{ matrix.worker_index }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Dedicated 4-server cluster (each runner with 16GB+ memory pool)
        worker_index: [1, 2, 3, 4]

    steps:
      - name: Check Worker Index vs Target Count
        id: check_active
        run: |
          echo "active=true" >> "$GITHUB_OUTPUT"
          echo "Cloud Server ${{ matrix.worker_index }}/4 is active for job ${{ inputs.job_id }} (Dedicated 4-Server Cluster)"

      - name: Checkout FreeCloud Repository
        if: steps.check_active.outputs.active == 'true'
        uses: actions/checkout@v4

      - name: Allocate 16GB RAM Memory Pool & Clean Disk Space
        if: steps.check_active.outputs.active == 'true'
        run: |
          echo "=== Freeing Disk Space on Runner ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

          echo "=== Configuring 16GB High-Speed Memory Pool ==="
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          echo "=== Runner Memory Specifications (16GB+ Pool Active) ==="
          free -h
          lscpu | grep "Model name\|CPU(s):" || true

      - name: Set up Python
        if: steps.check_active.outputs.active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Worker Dependencies
        if: steps.check_active.outputs.active == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install httpx pydantic requests opencv-python-headless numpy imageio-ffmpeg

      - name: Execute Worker Runner Entrypoint
        if: steps.check_active.outputs.active == 'true'
        env:
          FREECLOUD_BACKEND_URL: ${{ inputs.backend_url }}
          FREECLOUD_JOB_ID: ${{ inputs.job_id }}
          WORKER_ID: "gha-runner-${{ inputs.job_id }}-${{ matrix.worker_index }}"
        run: |
          python github/worker_entrypoint.py \
            --backend-url "$FREECLOUD_BACKEND_URL" \
            --job-id "$FREECLOUD_JOB_ID" \
            --worker-id "$WORKER_ID" \
            --model "${{ inputs.model_name }}" \
            --max-idle-seconds 45
